name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ build-essential
        
    - name: Configure and Build
      run: |
        mkdir build
        cd build
        cmake ..
        make
        
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
