name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ build-essential doxygen graphviz
        
    - name: Configure and Build
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON ..
        make -j2
        
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
        
    - name: Generate docs
      run: |
        cd build
        make docs
